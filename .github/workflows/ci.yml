name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run still in flight, so CI
# always reports on the newest commit rather than queueing behind stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fails on any file dart format would rewrite, so formatting never
      # becomes a diff-noise argument in review.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      # The widget tests run the real SQLite engine through
      # sqflite_common_ffi, so this needs no simulator and no device.
      - name: Test
        run: flutter test
