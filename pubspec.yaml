name: hydrafuel
description: Precise water, macro and micronutrient tracking with hard water reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  intl: ^0.19.0
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Runs the real SQLite engine inside `flutter test`, so the widget tests
  # exercise the same schema and queries the phone will.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
